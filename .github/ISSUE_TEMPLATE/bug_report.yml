name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: With the demo project if you can.
      placeholder: |
        1. Open the demo's outline
        2. ...
  - type: textarea
    id: log
    attributes:
      label: Server log
      description: The end of ~/.research-deck/logs/server.log, or the terminal that runs scripts/dev.sh. Remove anything private.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit (git rev-parse --short HEAD) or the release.
  - type: input
    id: system
    attributes:
      label: System
      description: OS, Python and Node versions, browser.
