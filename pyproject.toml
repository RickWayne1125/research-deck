[project]
name = "research-deck"
version = "0.2.0"
description = "A local research dashboard: a research map with dependencies, one AI conversation per project (Claude Code or Codex), the paper, the experiments and the code."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = ["fastapi>=0.118", "uvicorn[standard]>=0.37", "pydantic>=2", "pyyaml", "httpx", "matplotlib", "numpy", "mcp>=1", "pypdf>=5"]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["server"]

[tool.pytest.ini_options]
pythonpath = ["server"]
testpaths = ["tests"]
