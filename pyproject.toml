[project]
name = "research-deck"
version = "0.2.0"
description = "A local research dashboard: a research map with dependencies, one AI conversation per project (Claude Code or Codex), the paper, the experiments and the code."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = ["fastapi>=0.118", "uvicorn[standard]>=0.37", "pydantic>=2", "pyyaml", "httpx", "matplotlib", "numpy", "mcp>=1", "pypdf>=5"]

[project.optional-dependencies]
test = ["pytest"]
# contributors: the checks CI runs (ruff, pytest) and the documentation site (MkDocs)
dev = ["pytest", "ruff>=0.8"]
docs = ["mkdocs-material>=9.5"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["server"]

[tool.setuptools.package-data]
research_deck = ["outline/templates/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["server"]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"
src = ["server", "tests"]
# the demo's sample project: its files make the demo's fixed git history, so they stay as they are
extend-exclude = ["demo/minimal"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # long lines: line-length guides imports and reviewers; nothing reflows code
    "E741",  # short names such as l in comprehensions
    "B008",  # FastAPI's Query(...) and Depends(...) defaults
    "B904",  # raise ... from inside except: optional
    "B905",  # zip(strict=...): optional
]

[tool.ruff.lint.per-file-ignores]
"server/research_deck/writing/review.py" = ["B023"]  # the callbacks run at once, inside the loop
"tests/**" = ["B023", "E731"]
"server/research_deck/dag/rd_exec/rd_trace/**" = ["UP"]  # runs inside the traced program's Python, which may be older

[tool.ruff.lint.isort]
known-first-party = ["research_deck"]
